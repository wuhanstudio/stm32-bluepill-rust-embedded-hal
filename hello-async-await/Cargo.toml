[package]
name = "hello-rtt-print"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
embedded-hal = "1.0.0"
panic-halt = "1.0.0"
rtt-target = "0.6.2"
embassy-executor = { version = "0.9.1", features = ["arch-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-time = "0.5.0"
embassy-stm32 = { version = "0.5.0", features = ["stm32f103c8", "time", "time-driver-any"] }
