[package]
name = "hello-systick-overflow"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
critical-section = "1.2.0"
embedded-hal = "1.0.0"
fugit = "0.3.9"
panic-halt = "1.0.0"
portable-atomic = { version = "1.13.1", default-features = false, features = ["require-cas", "critical-section"] }
rtt-target = "0.6.2"
stm32f1xx-hal = {version = "0.11.0", features = ["stm32f103"]}
