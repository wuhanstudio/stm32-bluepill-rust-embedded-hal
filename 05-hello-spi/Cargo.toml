[package]
name = "hello-spi"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
# defmt = "1.0.1"
# defmt-rtt = "1.1.0"
rtt-target = {version = "0.3.0", features = ["cortex-m"] }
embedded-hal = "1.0.0"
nb = "1.1.0"
panic-halt = "1.0.0"
# stm32f1xx-hal = {version = "0.11.0", features = ["stm32f103"]}
panic-probe = "1.0.0"
ssd1306 = "0.10.0"
embedded-graphics = "0.8.1"
embedded-hal-bus = "0.3.0"
embassy-stm32 = {version = "0.5.0", features = [
  "stm32f103c8",
  "memory-x",
  "exti",
  "time-driver-tim3",
  "unstable-pac",
] }
embassy-time = "0.5.0"

[profile.dev]
lto = true
opt-level = "s"
incremental = false
codegen-units = 1
debug = 2
